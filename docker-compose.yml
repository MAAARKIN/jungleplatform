services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
      POSTGRES_DB: jungle
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle"]
      interval: 3s
      timeout: 3s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 5s
      retries: 30

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:4566/_localstack/health | grep -qE '\"sqs\": \"(running|available)\"'"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: postgres://jungle:jungle@postgres:5432/jungle?sslmode=disable
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      KEYCLOAK_ISSUER_URL: http://localhost:8180/realms/jungle
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/jungle/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: internal
      KEYCLOAK_CLIENT_SECRET: internal-secret
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      POSTGRES_DSN: postgres://jungle:jungle@postgres:5432/jungle?sslmode=disable
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      KEYCLOAK_ISSUER_URL: http://localhost:8180/realms/jungle
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/jungle/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: internal
      KEYCLOAK_CLIENT_SECRET: internal-secret
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    command: ["-direction", "up"]
    environment:
      POSTGRES_DSN: postgres://jungle:jungle@postgres:5432/jungle?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy